name: Publish Cloud Home Image

on:
  push:
    branches:
      - main
      - viethoang
    paths:
      - "Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "server/**"
      - "shared/**"
      - "src/**"
      - "skills/**"
      - "deploy/fly/**"
      - "scripts/**"
      - ".github/workflows/publish-cloud-home.yml"
  workflow_dispatch:
    inputs:
      grok_version:
        description: "Grok CLI version to bake into cloud-home (leave empty to skip if x.ai CDN is unreachable)"
        required: false
        default: "1.0.41"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BigmanBot repository
        uses: actions/checkout@v4

      - name: Free runner disk space and ensure swap for Vite bundle
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          if ! swapon --show | grep -q '/swapextras'; then
            sudo fallocate -l 4G /swapextras && sudo chmod 600 /swapextras && sudo mkswap /swapextras && sudo swapon /swapextras || true
          fi
          df -h
          free -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: meta
        run: |
          OWNER_LOWER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER_LOWER}/bigmanbot-cloud-home" >> "$GITHUB_OUTPUT"
          echo "sha_tag=ghcr.io/${OWNER_LOWER}/bigmanbot-cloud-home:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push cloud-home image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cloud-home
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.sha_tag }}
          build-args: |
            GROK_VERSION=${{ inputs.grok_version || '1.0.41' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
